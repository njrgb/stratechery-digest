name: Daily Newsletter Summaries

on:
  schedule:
    - cron: '0 13 * * *'    # 1pm UTC = 6am PT  — catches early-morning articles
    - cron: '0 19 * * *'    # 7pm UTC = noon PT — catches mid-morning articles
  workflow_dispatch:          # also allows manual trigger from GitHub UI

jobs:
  summarize:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Stratechery summarizer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STRATECHERY_FEED: ${{ secrets.STRATECHERY_FEED }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: python summarize.py

      - name: Run Lenny summarizer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: python lenny.py
